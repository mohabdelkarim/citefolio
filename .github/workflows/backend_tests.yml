name: backend_tests

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend_tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend_tests.yml"
  workflow_dispatch:

concurrency:
  group: backend_tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Pytest
        run: pytest -q
